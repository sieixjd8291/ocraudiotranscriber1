<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upload documents, images, and audio files, or record audio to extract text and transcribe mixed Bengali and English content." />
    <!-- Preconnect to the Google Fonts origins used for the Inter font (CSS on
         fonts.googleapis.com, font files on fonts.gstatic.com). preconnect
         already covers DNS resolution + TLS handshake, so explicit dns-prefetch
         hints for the same hosts would be redundant. Font Awesome (cdnjs) and
         MathJax (jsdelivr) are NOT preconnected here: Font Awesome is never
         loaded at runtime, and MathJax loads on demand only when a result with
         math is rendered, so warming those connections on every navigation is
         wasted handshakes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Mobile Optimization Meta Tags -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Remix Audio" />
    
    <title>Transcriber & Audio Editor</title>
    <!-- MathJax config and script will be loaded dynamically on demand in the markdown renderer to optimize mobile performance -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
